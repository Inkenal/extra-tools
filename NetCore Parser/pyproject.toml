[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcore-forensics"
version = "1.0.0rc12"
description = "Read-only Windows NetCore ETL forensic event parser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["forensics", "ETW", "Windows", "NetCore", "incident-response"]
authors = [{name = "NetCore Forensics contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Topic :: Security"]

[project.scripts]
netcore-forensics = "netcore_forensics.cli:main"

[tool.setuptools.package-data]
netcore_forensics = ["module_map.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
